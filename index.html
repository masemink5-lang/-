      ctx.font = '11px ' + FONT;
      ctx.fillText('按 ' + (i+1) + ' 或 点击', bx + PERK_CARD_W/2, by + PERK_CARD_H - 10);
    }

    ctx.textAlign = 'center';
    ctx.font = '13px ' + FONT;
    ctx.fillStyle = 'rgba(150, 130, 110, 0.6)';
    ctx.fillText('（亦可按数字键 1 / 2 / 3 快速选择）', cx, PERK_CARD_Y + PERK_CARD_H + 30);
    ctx.restore();
  }

  function drawOverlay() {
    if (currentScreen === SCREEN.PLAYING) return;
    if (currentScreen === SCREEN.MENU) { drawMenu(); return; }
    if (currentScreen === SCREEN.FACTION_SELECT) { drawFactionSelect(); return; }
    if (currentScreen === SCREEN.LEVEL_SELECT) { drawLevelSelect(); return; }
    if (currentScreen === SCREEN.SKIN_SELECT) { drawSkinSelect(); return; }
    if (currentScreen === SCREEN.PERK) { drawPerkOverlay(); return; }

    ctx.save();
    ctx.fillStyle = 'rgba(255, 250, 240, 0.92)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const cx = W/2;
    const blink = (Math.sin(time * 3.2) + 1) / 2;

    if (currentScreen === SCREEN.PAUSED) {
      if (progress.currentSkin === 'mouse') drawMouseShip(cx, 300, 55, false);
      else if (progress.currentSkin === 'milk') drawMilkShip(cx, 300, 55, false);
      else drawFrogShip(cx, 300, 55, false);
      ctx.font = 'bold 52px ' + FONT;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillText('休 息 中', cx, 440);
      ctx.font = '20px ' + FONT;
      ctx.fillStyle = 'rgba(120, 100, 80, 0.8)';
      ctx.fillText('点击屏幕 · 继续', cx, 510);
    } else if (currentScreen === SCREEN.LEVEL_CLEAR) {
      if (progress.currentSkin === 'mouse') drawMouseShip(cx, 300, 55, false);
      else if (progress.currentSkin === 'milk') drawMilkShip(cx, 300, 55, false);
      else drawFrogShip(cx, 300, 55, false);
      ctx.font = 'bold 48px ' + FONT;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillText('第 ' + level + ' 关 破', cx, 440);
      ctx.font = '20px ' + FONT;
      ctx.fillStyle = 'rgba(120, 100, 80, 0.8)';
      ctx.fillText('准备进入下一关…', cx, 510);
    } else if (currentScreen === SCREEN.GAME_OVER) {
      drawMouseShip(cx - 120, 300, 45, false);
      drawFrogShip(cx + 120, 300, 45, false);
      ctx.font = 'bold 50px ' + FONT;
      ctx.fillStyle = '#f5b8b8';
      ctx.fillText('奶 眠 了', cx, 430);
      ctx.font = '22px ' + FONT;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillText('本局积分：' + score, cx, 500);
      ctx.font = '18px ' + FONT;
      ctx.fillStyle = 'rgba(120, 100, 80, 0.8)';
      ctx.fillText('历史最高：' + progress.highScore, cx, 540);
      ctx.globalAlpha = 0.4 + blink * 0.6;
      ctx.font = 'bold 20px ' + FONT;
      ctx.fillStyle = '#f5b8b8';
      ctx.fillText('点击屏幕 · 返回主菜单', cx, 620);
      ctx.globalAlpha = 1;
    } else if (currentScreen === SCREEN.VICTORY) {
      drawFrogShip(cx - 150, 280, 42, false);
      drawMouseShip(cx, 270, 46, false);
      drawMilkShip(cx + 150, 280, 42, false);
      ctx.font = 'bold 52px ' + FONT;
      ctx.shadowColor = 'rgba(252, 229, 126, 0.9)';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillText('奶 王 加 冕', cx, 120);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 20px ' + FONT;
      ctx.fillStyle = '#f5b8b8';
      ctx.fillText('恭喜通关全部 ' + ADVENTURE_TOTAL + ' 关！', cx, 180);
      ctx.font = '22px ' + FONT;
      ctx.fillStyle = '#5a4a3a';
      ctx.fillText('最终积分：' + score, cx, 500);
      ctx.font = '18px ' + FONT;
      ctx.fillStyle = 'rgba(120, 100, 80, 0.8)';
      ctx.fillText('历史最高：' + progress.highScore, cx, 540);
      ctx.globalAlpha = 0.4 + blink * 0.6;
      ctx.font = 'bold 20px ' + FONT;
      ctx.fillStyle = '#f5b8b8';
      ctx.fillText('点击屏幕 · 返回主菜单', cx, 620);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    if (currentScreen !== SCREEN.MENU && currentScreen !== SCREEN.FACTION_SELECT &&
        currentScreen !== SCREEN.LEVEL_SELECT && currentScreen !== SCREEN.SKIN_SELECT) {
      ctx.save();
      if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
      drawBricks();
      drawParticles();
      drawDrops();
      drawEnemyBullets();
      drawShip();
      drawBullets();
      ctx.restore();
      drawToasts();
      drawHUD();
    }
    drawOverlay();
  }

  /* =========================================================
   *  输入
   * ========================================================= */
  window.addEventListener('keydown', function (e) {
    const code = e.code;
    Audio.init(); Audio.resume();
    if (currentScreen === SCREEN.PERK) {
      if (code === 'Digit1' || code === 'Numpad1') { e.preventDefault(); pickPerk(0); return; }
      if (code === 'Digit2' || code === 'Numpad2') { e.preventDefault(); pickPerk(1); return; }
      if (code === 'Digit3' || code === 'Numpad3') { e.preventDefault(); pickPerk(2); return; }
      return;
    }
    if (currentScreen === SCREEN.FACTION_SELECT || currentScreen === SCREEN.LEVEL_SELECT || currentScreen === SCREEN.SKIN_SELECT) {
      if (code === 'Escape') { e.preventDefault(); currentScreen = SCREEN.MENU; }
      return;
    }
    if ((currentScreen === SCREEN.PLAYING || currentScreen === SCREEN.PAUSED) && code === 'Escape') {
      e.preventDefault();
      currentScreen = SCREEN.MENU;
      Audio.pauseSound();
      shooting = false;
      BGM.stop();
      return;
    }
    if (code === 'ArrowLeft' || code === 'KeyA') { keys.left = true; e.preventDefault(); }
    else if (code === 'ArrowRight' || code === 'KeyD') { keys.right = true; e.preventDefault(); }
    else if (code === 'ArrowUp' || code === 'KeyW') { keys.up = true; e.preventDefault(); }
    else if (code === 'ArrowDown' || code === 'KeyS') { keys.down = true; e.preventDefault(); }
    else if (code === 'Space') {
      e.preventDefault();
      if (currentScreen === SCREEN.MENU) { if (!e.repeat) currentScreen = SCREEN.FACTION_SELECT; }
      else if (currentScreen === SCREEN.PLAYING) shooting = true;
    }
    else if (code === 'KeyP') {
      e.preventDefault();
      if (!e.repeat && (currentScreen === SCREEN.PLAYING || currentScreen === SCREEN.PAUSED)) togglePause();
    }
    else if (code === 'KeyM') {
      e.preventDefault();
      if (!e.repeat) {
        const m = Audio.toggleMute();
        BGM.setMuted(m);
        showToast(m ? '音效已关' : '音效已开', m ? '#c0b0a0' : '#5a4a3a');
      }
    }
  }, { passive: false });

  window.addEventListener('keyup', function (e) {
    const code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
    if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
    if (code === 'ArrowUp' || code === 'KeyW') keys.up = false;
    if (code === 'ArrowDown' || code === 'KeyS') keys.down = false;
    if (code === 'Space') shooting = false;
  });

  let activePointerId = null;

  function handlePointerMove(clientX, clientY) {
    const p = toLogical(clientX, clientY);
    mouseX = p.x; mouseY = p.y;
    if (currentScreen === SCREEN.PERK || currentScreen === SCREEN.LEVEL_SELECT ||
        currentScreen === SCREEN.MENU || currentScreen === SCREEN.FACTION_SELECT ||
        currentScreen === SCREEN.SKIN_SELECT) return;
    if (currentScreen === SCREEN.PLAYING || currentScreen === SCREEN.PAUSED) {
      const hb = getShipHitbox();
      ship.x = clamp(p.x, hb.w/2, W - hb.w/2);
      ship.y = clamp(p.y, SHIP_Y_MIN, H - hb.h/2 - 4);
    }
  }

  canvas.addEventListener('pointermove', function (e) {
    if (activePointerId !== null && e.pointerId !== activePointerId) return;
    handlePointerMove(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault(); Audio.init(); Audio.resume();
    const p = toLogical(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;
    if (e.pointerType !== 'mouse') activePointerId = e.pointerId;

    if ((currentScreen === SCREEN.PLAYING || currentScreen === SCREEN.PAUSED ||
         currentScreen === SCREEN.GAME_OVER || currentScreen === SCREEN.VICTORY)) {
      const r = BACK_BTN;
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
        currentScreen = SCREEN.MENU;
        Audio.pauseSound();
        shooting = false;
        BGM.stop();
        return;
      }
    }
    if (currentScreen === SCREEN.MENU) {
      // 用户第一次点击主菜单时，启动音频上下文
      Audio.init();
      BGM.setStarted();
      const cx = W/2, btnW = 240, btnH = 60;
      const btn1X = cx - btnW - 14, btn2X = cx + 14, btnY = 400;
      if (p.x >= btn1X && p.x <= btn1X + btnW && p.y >= btnY && p.y <= btnY + btnH) {
        gameMode = 'adventure'; currentScreen = SCREEN.FACTION_SELECT; return;
      }
      if (p.x >= btn2X && p.x <= btn2X + btnW && p.y >= btnY && p.y <= btnY + btnH) {
        gameMode = 'endless'; currentScreen = SCREEN.FACTION_SELECT; return;
      }
      const skinBtnW = 200, skinBtnH = 48;
      const skinBtnX = cx - skinBtnW/2, skinBtnY = btnY + btnH + 30;
      if (p.x >= skinBtnX && p.x <= skinBtnX + skinBtnW && p.y >= skinBtnY && p.y <= skinBtnY + skinBtnH) {
        currentScreen = SCREEN.SKIN_SELECT; return;
      }
      return;
    }
    if (currentScreen === SCREEN.FACTION_SELECT) {
      const keys3 = ['mouse', 'milk', 'frog'];
      for (let i = 0; i < 3; i++) {
        const bx = facCardX(i);
        if (p.x >= bx && p.x <= bx + FAC_CARD_W && p.y >= FAC_CARD_Y && p.y <= FAC_CARD_Y + FAC_CARD_H) {
          resetRun(keys3[i]);
          if (gameMode === 'adventure') currentScreen = SCREEN.LEVEL_SELECT;
          else beginRun(keys3[i], 1);
          return;
        }
      }
      const backW = 130, backH = 42;
      const backX = W/2 - backW/2, backY = H - 70;
      if (p.x >= backX && p.x <= backX + backW && p.y >= backY && p.y <= backY + backH) currentScreen = SCREEN.MENU;
      return;
    }
    if (currentScreen === SCREEN.LEVEL_SELECT) {
      for (let i = 1; i <= ADVENTURE_TOTAL; i++) {
        const r = levelBtnRect(i - 1);
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
          if (i <= progress.unlockedLevel && run) beginRun(run.faction, i);
          return;
        }
      }
      const backW = 140, backH = 44;
      const backX = W/2 - backW/2, backY = H - 80;
      if (p.x >= backX && p.x <= backX + backW && p.y >= backY && p.y <= backY + backH) currentScreen = SCREEN.MENU;
      return;
    }
    if (currentScreen === SCREEN.SKIN_SELECT) {
      const skins = ['mouse', 'milk', 'frog'];
      for (let i = 0; i < 3; i++) {
        const sk = skins[i];
        const bx = skinCardX(i);
        if (p.x >= bx && p.x <= bx + SKIN_CARD_W && p.y >= SKIN_CARD_Y && p.y <= SKIN_CARD_Y + SKIN_CARD_H) {
          if (progress.unlockedSkins.indexOf(sk) >= 0) {
            progress.currentSkin = sk; saveProgress(); Audio.powerupPickup();
          } else Audio.negativePickup();
          return;
        }
      }
      const backW = 130, backH = 42;
      const backX = W/2 - backW/2, backY = H - 70;
      if (p.x >= backX && p.x <= backX + backW && p.y >= backY && p.y <= backY + backH) currentScreen = SCREEN.MENU;
      return;
    }
    if (currentScreen === SCREEN.PERK) {
      for (let i = 0; i < perkChoices.length; i++) {
        const bx = perkCardX(i);
        if (p.x >= bx && p.x <= bx + PERK_CARD_W && p.y >= PERK_CARD_Y && p.y <= PERK_CARD_Y + PERK_CARD_H) {
          pickPerk(i); return;
        }
      }
      return;
    }
    if (currentScreen === SCREEN.PLAYING) {
      const hb = getShipHitbox();
      ship.x = clamp(p.x, hb.w/2, W - hb.w/2);
      ship.y = clamp(p.y, SHIP_Y_MIN, H - hb.h/2 - 4);
      shooting = true;
    } else if (currentScreen === SCREEN.PAUSED) {
      currentScreen = SCREEN.PLAYING; Audio.resumeSound(); BGM.resume();
    } else if (currentScreen === SCREEN.GAME_OVER || currentScreen === SCREEN.VICTORY) {
      currentScreen = SCREEN.MENU;
    }
  }, { passive: false });

  canvas.addEventListener('pointerup', function (e) {
    if (e.pointerType !== 'mouse' && e.pointerId === activePointerId) {
      activePointerId = null;
      shooting = false;
    } else if (e.pointerType === 'mouse') {
      shooting = false;
    }
  });
  canvas.addEventListener('pointercancel', function (e) {
    if (e.pointerId === activePointerId) activePointerId = null;
    shooting = false;
  });
  canvas.addEventListener('pointerleave', function () { shooting = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

  /* =========================================================
   *  主循环
   * ========================================================= */
  let lastTime = 0;
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000; lastTime = ts;
    if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  resetRun('mouse');
  prepareBackground();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
